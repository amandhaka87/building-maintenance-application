  <!-- iOS / Apple PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="apple-touch-icon" id="apple-icon" href="/icon.svg" />

  <!-- Generate PNG icon via canvas (iOS requires PNG, not SVG) -->
  <script>
  (function(){
    try {
      var c=document.createElement('canvas'); c.width=c.height=180;
      var x=c.getContext('2d');
      var g=x.createLinearGradient(0,0,180,180);
      g.addColorStop(0,'#1a3a5c'); g.addColorStop(1,'#1e5799');
      x.beginPath();
      x.moveTo(28,0); x.lineTo(152,0); x.arcTo(180,0,180,28,28);
      x.lineTo(180,152); x.arcTo(180,180,152,180,28);
      x.lineTo(28,180); x.arcTo(0,180,0,152,28);
      x.lineTo(0,28); x.arcTo(0,0,28,0,28);
      x.closePath(); x.fillStyle=g; x.fill();
      x.fillStyle='white';
      x.beginPath(); x.moveTo(14,78); x.lineTo(90,16); x.lineTo(166,78); x.closePath(); x.fill();
      x.fillRect(26,74,128,96);
      x.fillStyle='#1e5799';
      x.fillRect(36,84,28,22); x.fillRect(76,84,28,22); x.fillRect(116,84,28,22);
      x.fillRect(69,118,42,52);
      x.fillStyle='#f59e0b';
      x.beginPath(); x.arc(138,138,34,0,6.28); x.fill();
      x.fillStyle='white';
      x.fillRect(133,112,12,44); x.fillRect(120,110,38,12); x.fillRect(120,144,38,10);
      var l=document.getElementById('apple-icon');
      if(l) l.href=c.toDataURL('image/png');
    } catch(e){}
  })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

const PRI_COLOR  = { Low:'green',        Medium:'blue',   High:'orange',    Urgent:'red' };

  red:    'bg-red-100 text-red-800 border border-red-200',

  yellow: 'bg-yellow-100 text-yellow-800 border border-yellow-200',

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('en-IN', {
    day: '2-digit', month: 'short', year: 'numeric',
    hour: '2-digit', minute: '2-digit',

}

/* ═══════════════════════════════════════════

═══════════════════════════════════════════ */

    <span className={`inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold ${BADGE_CLS[colorKey] || 'bg-gray-100 text-gray-700'}`}>

}

function StatCard({ label, value, icon, gradient }) {

}

function Modal({ title, subtitle, onClose, children }) {
  useEffect(() => {
    const esc = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', esc);
    return () => document.removeEventListener('keydown', esc);
  }, []);
  return (
    <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 fade-in" onClick={onClose}>
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md" onClick={e => e.stopPropagation()}>
        <div className="flex items-start justify-between p-6 border-b border-gray-100">
          <div>
            <h3 className="text-lg font-bold text-gray-800">{title}</h3>
            {subtitle && <p className="text-sm text-gray-500 mt-0.5">{subtitle}</p>}
          </div>
          <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-xl leading-none mt-0.5">✕</button>
        </div>
        <div className="p-6">{children}</div>
      </div>
    </div>
  );
}

function Toast({ message, type = 'success' }) {
  const bg = type === 'success' ? 'bg-green-600' : 'bg-blue-600';
  return (
    <div className={`fixed top-5 right-5 z-50 ${bg} text-white px-5 py-3 rounded-xl shadow-2xl text-sm font-medium fade-in flex items-center gap-2`}>
      {type === 'success' ? '✅' : 'ℹ️'} {message}
    </div>
  );
}

function InstallPrompt() {
  const [show, setShow]     = useState(false);
  const [isIOS, setIsIOS]   = useState(false);
  const [prompt, setPrompt] = useState(null);
  const [expanded, setExp]  = useState(false);

  useEffect(() => {
    const standalone = window.matchMedia('(display-mode: standalone)').matches
                    || window.navigator.standalone === true;
    if (standalone) return;

    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if (ios) { setIsIOS(true); setShow(true); }

    const handler = (e) => { e.preventDefault(); setPrompt(e); setShow(true); };
    window.addEventListener('beforeinstallprompt', handler);
    return () => window.removeEventListener('beforeinstallprompt', handler);
  }, []);

  if (!show) return null;

  return (
    <div className="fixed bottom-5 left-4 right-4 z-50 max-w-sm mx-auto fade-in">
      <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden">
        {/* Main row */}
        <div className="p-4 flex items-center gap-3">
          <div className="w-12 h-12 rounded-xl shrink-0 gov-gradient flex items-center justify-center text-2xl">🏛️</div>
          <div className="flex-1 min-w-0">
            <div className="font-bold text-slate-800 text-sm">Install as App</div>
            <div className="text-xs text-slate-500 mt-0.5">Use without browser, works offline</div>
          </div>
          <div className="flex items-center gap-2 shrink-0">
            {isIOS ? (
              <button onClick={() => setExp(!expanded)}
                className="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-2 rounded-xl transition">
                How?
              </button>
            ) : prompt ? (
              <button onClick={() => { prompt.prompt(); setShow(false); }}
                className="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-2 rounded-xl transition">
                Install
              </button>
            ) : null}
            <button onClick={() => setShow(false)} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
          </div>
        </div>

        {/* iOS step-by-step guide */}
        {isIOS && expanded && (
          <div className="border-t border-slate-100 px-4 pb-4 pt-3 bg-blue-50 fade-in">
            <p className="text-xs font-bold text-blue-900 mb-2">⚠️ Open this page in Safari first, then:</p>
            <div className="space-y-2">
              {[
                ['1', '⬆️', 'Tap the Share button at the bottom of Safari'],
                ['2', '➕', 'Scroll and tap "Add to Home Screen"'],
                ['3', '✅', 'Tap "Add" in the top-right corner'],
              ].map(([n, icon, text]) => (
                <div key={n} className="flex items-center gap-2 text-xs text-slate-700">
                  <span className="w-5 h-5 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold shrink-0 text-xs">{n}</span>
                  <span className="text-base">{icon}</span>
                  <span>{text}</span>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function Footer() {

/* ═══════════════════════════════════════════
   LOGIN PAGE
═══════════════════════════════════════════ */
function LoginPage({ onLogin }) {
  const [role, setRole]     = useState('');
  const [userId, setUserId] = useState('');

  const users = useMemo(() => USERS[role] || [], [role]);

  function doLogin() {
    if (!role || !userId) return;
    const user = users.find(u => u.id === userId);
    if (user) onLogin(user);
  }

  return (
    <div className="min-h-screen gov-gradient flex items-center justify-center p-4">
      <div className="w-full max-w-md fade-in">
        {/* Card */}
        <div className="bg-white rounded-3xl shadow-2xl overflow-hidden">
          {/* Banner */}
          <div className="gov-gradient text-white text-center py-10 px-6">
            <div className="text-6xl mb-4">🏛️</div>
            <h1 className="text-xl font-bold leading-tight">Govt. Polytechnic Cheeka</h1>
            <div className="mt-2 inline-block bg-white/20 text-xs font-semibold px-4 py-1.5 rounded-full">
              Building Maintenance Management System
            </div>
          </div>

          {/* Form */}
          <div className="p-8 space-y-5">
            {/* Role */}
            <div>
              <label className="text-sm font-semibold text-gray-700 block mb-1.5">Select Your Role</label>
              <select
                value={role}
                onChange={e => { setRole(e.target.value); setUserId(''); }}
                className="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
              >
                <option value="">— Choose your role —</option>
                <option value="staff">Department Staff</option>
                <option value="principal">Principal</option>
                <option value="incharge">Workshop Incharge</option>
              </select>
            </div>

            {/* User */}
            {role && (
              <div className="fade-in">
                <label className="text-sm font-semibold text-gray-700 block mb-1.5">Select User</label>
                <select
                  value={userId}
                  onChange={e => setUserId(e.target.value)}
                  className="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                >
                  <option value="">— Choose user —</option>
                  {users.map(u => (
                    <option key={u.id} value={u.id}>
                      {u.name}{u.title ? ` — ${u.title}` : ''}
                    </option>
                  ))}
                </select>
              </div>
            )}

            <button
              onClick={doLogin}
              disabled={!role || !userId}
              className="w-full gov-gradient text-white py-3.5 rounded-xl font-bold disabled:opacity-40 disabled:cursor-not-allowed hover:opacity-90 transition text-sm tracking-wide"
            >
              Login to Dashboard →
            </button>

            <p className="text-center text-xs text-gray-400">
              Demo Application · Select role and user to continue
            </p>
          </div>
        </div>

        <Footer />

        {/* Role cards */}
        <div className="grid grid-cols-3 gap-3 mt-5">
          {[
            { icon:'👤', label:'Department\nStaff',    desc:'Submit requests' },
            { icon:'👨‍💼', label:'Principal',          desc:'Assign work' },
            { icon:'🔨', label:'Workshop\nIncharge',   desc:'Update status' },
          ].map(r => (
            <div key={r.label} className="bg-white/15 backdrop-blur rounded-xl p-3 text-center text-white">
              <div className="text-2xl mb-1">{r.icon}</div>
              <div className="text-xs font-semibold whitespace-pre-line leading-tight">{r.label}</div>
              <div className="text-xs opacity-70 mt-0.5">{r.desc}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   STAFF DASHBOARD
═══════════════════════════════════════════ */
function StaffDashboard({ user, requests, onSubmit, onLogout }) {
  const [showForm, setShowForm] = useState(false);
  const [toast, setToast]       = useState(null);
  const [form, setForm]         = useState({ category:'', priority:'', location:'', description:'' });

  const mine    = requests.filter(r => r.submittedBy.id === user.id);
  const pending = mine.filter(r => r.status === 'Pending').length;
  const active  = mine.filter(r => r.status === 'Assigned' || r.status === 'In Progress').length;
  const done    = mine.filter(r => r.status === 'Completed').length;

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(null), 3500);
  }

  function handleSubmit(e) {
    e.preventDefault();
    const { category, priority, location, description } = form;
    if (!category || !priority || !location.trim() || !description.trim()) return;
    onSubmit({ category, priority, location: location.trim(), description: description.trim(), submittedBy: user });
    setForm({ category:'', priority:'', location:'', description:'' });
    setShowForm(false);
    showToast('Request submitted! Forwarded to Principal automatically.');
  }

  function setF(key, val) { setForm(prev => ({ ...prev, [key]: val })); }

  return (
    <div className="min-h-screen bg-slate-100">
      <Navbar user={user} onLogout={onLogout} />
      {toast && <Toast message={toast} />}

      <main className="max-w-5xl mx-auto px-4 py-7 space-y-6">
        <h2 className="text-xl font-bold text-slate-800">
          Welcome, {user.name}
        </h2>

        {/* Stats */}
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
          <StatCard label="Total Requests"  value={mine.length} icon="📋" gradient="bg-gradient-to-br from-blue-500 to-blue-700" />
          <StatCard label="Pending"         value={pending}     icon="⏳" gradient="bg-gradient-to-br from-amber-500 to-amber-600" />
          <StatCard label="In Progress"     value={active}      icon="🔨" gradient="bg-gradient-to-br from-violet-500 to-violet-700" />
          <StatCard label="Completed"       value={done}        icon="✅" gradient="bg-gradient-to-br from-emerald-500 to-emerald-700" />
        </div>

        {/* Requests panel */}
        <div className="bg-white rounded-2xl shadow-sm border border-slate-100">
          <div className="flex items-center justify-between px-6 py-4 border-b border-slate-100">
            <h3 className="font-bold text-slate-800 text-base">My Work Requests</h3>
            <button
              onClick={() => setShowForm(!showForm)}
              className={`px-4 py-2 rounded-xl text-sm font-semibold transition ${showForm ? 'bg-red-50 text-red-600 hover:bg-red-100' : 'bg-blue-600 text-white hover:bg-blue-700'}`}
            >
              {showForm ? '✕ Cancel' : '＋ New Request'}
            </button>
          </div>

          {/* New request form */}
          {showForm && (
            <form onSubmit={handleSubmit} className="p-6 border-b border-slate-100 bg-blue-50 fade-in">
              <h4 className="font-bold text-blue-900 mb-4 flex items-center gap-2">📝 Submit New Work Request</h4>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <div>
                  <label className="text-xs font-semibold text-slate-600 block mb-1">Work Category *</label>
                  <select value={form.category} onChange={e => setF('category', e.target.value)} required
                    className="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white">
                    <option value="">Select category…</option>
                    {CATEGORIES.map(c => <option key={c}>{c}</option>)}
                  </select>
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-600 block mb-1">Priority *</label>
                  <select value={form.priority} onChange={e => setF('priority', e.target.value)} required
                    className="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white">
                    <option value="">Select priority…</option>
                    {PRIORITIES.map(p => <option key={p}>{p}</option>)}
                  </select>
                </div>
              </div>
              <div className="mb-4">
                <label className="text-xs font-semibold text-slate-600 block mb-1">Location *</label>
                <input value={form.location} onChange={e => setF('location', e.target.value)} required
                  placeholder="e.g. Room 105, Block A" maxLength={100}
                  className="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
              </div>
              <div className="mb-5">
                <label className="text-xs font-semibold text-slate-600 block mb-1">Description *</label>
                <textarea value={form.description} onChange={e => setF('description', e.target.value)} required
                  rows={3} placeholder="Describe the maintenance work needed…" maxLength={400}
                  className="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none" />
              </div>
              <div className="flex items-center gap-3">
                <button type="submit"
                  className="gov-gradient text-white px-6 py-2.5 rounded-xl text-sm font-bold hover:opacity-90 transition">
                  Submit Request
                </button>
                <span className="text-xs text-slate-500">Request will be automatically forwarded to the Principal.</span>
              </div>
            </form>
          )}

          {/* List */}
          <div className="p-6 space-y-3">
            {mine.length === 0 ? (
              <div className="text-center py-16 text-slate-400">
                <div className="text-5xl mb-3">📭</div>
                <div className="font-medium">No requests yet</div>
                <div className="text-sm mt-1">Click "New Request" to submit your first maintenance request.</div>
              </div>
            ) : (
              [...mine].reverse().map(r => <RequestCard key={r.id} req={r} />)
            )}
          </div>
        </div>
      </main>
      <Footer />
    </div>
  );
}

/* ═══════════════════════════════════════════
   PRINCIPAL DASHBOARD
═══════════════════════════════════════════ */
function PrincipalDashboard({ user, requests, onAssign, onLogout }) {
  const [tab, setTab]                 = useState('all');
  const [assignTarget, setAssignTarget] = useState(null);
  const [selectedIncharge, setSel]    = useState('');
  const [toast, setToast]             = useState(null);

  function showToast(msg) { setToast(msg); setTimeout(() => setToast(null), 3500); }

  const stats = useMemo(() => ({
    total:   requests.length,
    pending: requests.filter(r => r.status === 'Pending').length,
    assigned:requests.filter(r => r.status === 'Assigned').length,
    inprog:  requests.filter(r => r.status === 'In Progress').length,
    done:    requests.filter(r => r.status === 'Completed').length,
  }), [requests]);

  const filtered = useMemo(() => {
    const map = {
      all:      requests,
      pending:  requests.filter(r => r.status === 'Pending'),
      active:   requests.filter(r => r.status === 'Assigned' || r.status === 'In Progress'),
      done:     requests.filter(r => r.status === 'Completed'),
    };
    return [...(map[tab] || requests)].reverse();
  }, [requests, tab]);

  const compatible = useMemo(() =>
    assignTarget ? USERS.incharge.filter(i => i.category === assignTarget.category) : [],
  [assignTarget]);

  function doAssign() {
    if (!selectedIncharge || !assignTarget) return;
    const incharge = USERS.incharge.find(i => i.id === selectedIncharge);
    onAssign(assignTarget.id, incharge);
    setAssignTarget(null); setSel('');
    showToast(`Request #${assignTarget.id} assigned to ${incharge.name}.`);
  }

  const TABS = [['all','All Requests'], ['pending','⏳ Pending'], ['active','🔨 Active'], ['done','✅ Done']];

  return (
    <div className="min-h-screen bg-slate-100">
      <Navbar user={user} onLogout={onLogout} />
      {toast && <Toast message={toast} />}

      <main className="max-w-6xl mx-auto px-4 py-7 space-y-6">
        <h2 className="text-xl font-bold text-slate-800">Principal Dashboard</h2>

        {/* Stats */}
        <div className="grid grid-cols-2 sm:grid-cols-5 gap-4">
          <StatCard label="Total"      value={stats.total}    icon="📋" gradient="bg-gradient-to-br from-slate-600 to-slate-800" />
          <StatCard label="Pending"    value={stats.pending}  icon="⏳" gradient="bg-gradient-to-br from-amber-500 to-amber-600" />
          <StatCard label="Assigned"   value={stats.assigned} icon="📌" gradient="bg-gradient-to-br from-blue-500 to-blue-700" />
          <StatCard label="In Progress"value={stats.inprog}   icon="🔨" gradient="bg-gradient-to-br from-violet-500 to-violet-700" />
          <StatCard label="Completed"  value={stats.done}     icon="✅" gradient="bg-gradient-to-br from-emerald-500 to-emerald-700" />
        </div>

        {/* Workshop Incharges quick view */}
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
          {USERS.incharge.map(inc => {
            const assigned = requests.filter(r => r.assignedTo?.id === inc.id && r.status !== 'Completed').length;
            return (
              <div key={inc.id} className="bg-white rounded-xl p-4 border border-slate-100 flex items-center gap-3 card-lift">
                <span className="text-2xl">{CAT_ICON[inc.category]}</span>
                <div>
                  <div className="font-semibold text-slate-800 text-sm">{inc.name}</div>
                  <div className="text-xs text-slate-500">{inc.title}</div>
                  <div className="text-xs text-blue-600 font-medium mt-0.5">{assigned} active task{assigned !== 1 ? 's' : ''}</div>
                </div>
              </div>
            );
          })}
        </div>

        {/* Requests panel */}
        <div className="bg-white rounded-2xl shadow-sm border border-slate-100">
          <div className="px-6 pt-5 pb-3 border-b border-slate-100">
            <h3 className="font-bold text-slate-800 mb-3">Work Requests</h3>
            <div className="flex flex-wrap gap-2">
              {TABS.map(([key, label]) => (
                <button key={key} onClick={() => setTab(key)}
                  className={`px-4 py-1.5 rounded-full text-sm font-semibold transition ${tab === key ? 'bg-purple-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                  {label}
                </button>
              ))}
            </div>
          </div>

          <div className="p-6 space-y-3">
            {filtered.length === 0 ? (
              <div className="text-center py-16 text-slate-400">
                <div className="text-5xl mb-3">📭</div>
                <div className="font-medium">No requests in this category</div>
              </div>
            ) : filtered.map(r => (
              <RequestCard key={r.id} req={r}
                action={r.status === 'Pending' ? (
                  <button
                    onClick={() => { setAssignTarget(r); setSel(''); }}
                    className="bg-purple-600 hover:bg-purple-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition whitespace-nowrap"
                  >
                    📌 Assign
                  </button>
                ) : null}
              />
            ))}
          </div>
        </div>
      </main>
      <Footer />

      {/* Assign Modal */}
      {assignTarget && (
        <Modal
          title="Assign Work Request"
          subtitle={`#${assignTarget.id} · ${assignTarget.category} · ${assignTarget.location}`}
          onClose={() => setAssignTarget(null)}
        >
          <p className="text-xs text-slate-500 mb-4">
            Only {assignTarget.category} incharges are shown for this request.
          </p>
          <div className="space-y-2 mb-6">
            {compatible.map(inc => (
              <label key={inc.id}
                className={`flex items-center gap-3 p-3.5 rounded-xl cursor-pointer border-2 transition ${selectedIncharge === inc.id ? 'border-purple-500 bg-purple-50' : 'border-slate-100 hover:border-slate-200 bg-slate-50'}`}
              >
                <input type="radio" name="inc" value={inc.id} checked={selectedIncharge === inc.id}
                  onChange={() => setSel(inc.id)} className="accent-purple-600" />
                <div className="text-xl">{CAT_ICON[inc.category]}</div>
                <div>
                  <div className="font-bold text-slate-800">{inc.name}</div>
                  <div className="text-xs text-slate-500">{inc.title}</div>
                </div>
              </label>
            ))}
          </div>
          <div className="flex gap-3">
            <button onClick={() => setAssignTarget(null)}
              className="flex-1 border border-slate-300 text-slate-700 py-2.5 rounded-xl font-semibold hover:bg-slate-50 transition text-sm">
              Cancel
            </button>
            <button onClick={doAssign} disabled={!selectedIncharge}
              className="flex-1 bg-purple-600 hover:bg-purple-700 disabled:opacity-40 text-white py-2.5 rounded-xl font-bold transition text-sm">
              ✅ Assign Work
            </button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════
   INCHARGE DASHBOARD
═══════════════════════════════════════════ */
function InchargeDashboard({ user, requests, onUpdateStatus, onLogout }) {
  const [remarksModal, setRemarksModal] = useState(null);
  const [remarks, setRemarks]           = useState('');
  const [toast, setToast]               = useState(null);

  function showToast(msg) { setToast(msg); setTimeout(() => setToast(null), 3500); }

  const mine    = requests.filter(r => r.assignedTo?.id === user.id);
  const active  = mine.filter(r => r.status !== 'Completed');
  const done    = mine.filter(r => r.status === 'Completed');

  function handleAction(req) {
    if (req.status === 'Assigned') {
      onUpdateStatus(req.id, 'In Progress', null);
      showToast(`Task #${req.id} marked as In Progress.`);
    } else if (req.status === 'In Progress') {
      setRemarksModal(req); setRemarks('');
    }
  }

  function confirmComplete() {
    if (!remarksModal) return;
    onUpdateStatus(remarksModal.id, 'Completed', remarks.trim() || 'Work completed.');
    showToast(`Task #${remarksModal.id} marked as Completed. ✅`);
    setRemarksModal(null); setRemarks('');
  }

  const actionLabel = { 'Assigned': '▶ Start Work', 'In Progress': '✅ Mark Complete' };
  const actionColor = {
    'Assigned':   'bg-indigo-600 hover:bg-indigo-700',
    'In Progress':'bg-emerald-600 hover:bg-emerald-700',
  };

  return (
    <div className="min-h-screen bg-slate-100">
      <Navbar user={user} onLogout={onLogout} />
      {toast && <Toast message={toast} />}

      <main className="max-w-5xl mx-auto px-4 py-7 space-y-6">
        <div className="flex items-center gap-3">
          <span className="text-3xl">{CAT_ICON[user.category]}</span>
          <div>
            <h2 className="text-xl font-bold text-slate-800">{user.name}</h2>
            <p className="text-sm text-slate-500">{user.title}</p>
          </div>
        </div>

        {/* Stats */}
        <div className="grid grid-cols-3 gap-4">
          <StatCard label="Total Assigned" value={mine.length}   icon="📋" gradient="bg-gradient-to-br from-blue-500 to-blue-700" />
          <StatCard label="Active Tasks"   value={active.length} icon="⚙️" gradient="bg-gradient-to-br from-orange-500 to-orange-600" />
          <StatCard label="Completed"      value={done.length}   icon="✅" gradient="bg-gradient-to-br from-emerald-500 to-emerald-700" />
        </div>

        {/* Active Tasks */}
        <div className="bg-white rounded-2xl shadow-sm border border-slate-100">
          <div className="px-6 py-4 border-b border-slate-100">
            <h3 className="font-bold text-slate-800">Active Tasks</h3>
          </div>
          <div className="p-6 space-y-3">
            {active.length === 0 ? (
              <div className="text-center py-16 text-slate-400">
                <div className="text-5xl mb-3">🎉</div>
                <div className="font-medium">No active tasks</div>
                <div className="text-sm mt-1">All caught up! Check back later.</div>
              </div>
            ) : active.map(r => (
              <RequestCard key={r.id} req={r}
                action={actionLabel[r.status] && (
                  <button onClick={() => handleAction(r)}
                    className={`${actionColor[r.status]} text-white px-3 py-1.5 rounded-lg text-xs font-bold transition whitespace-nowrap`}>
                    {actionLabel[r.status]}
                  </button>
                )}
              />
            ))}
          </div>
        </div>

        {/* Completed */}
        {done.length > 0 && (
          <div className="bg-white rounded-2xl shadow-sm border border-slate-100">
            <div className="px-6 py-4 border-b border-slate-100">
              <h3 className="font-bold text-slate-800">Completed Tasks</h3>
            </div>
            <div className="p-6 space-y-3">
              {[...done].reverse().map(r => <RequestCard key={r.id} req={r} />)}
            </div>
          </div>
        )}
      </main>
      <Footer />

      {/* Completion Remarks Modal */}
      {remarksModal && (
        <Modal
          title="Mark Task as Completed"
          subtitle={`#${remarksModal.id} · ${remarksModal.location}`}
          onClose={() => setRemarksModal(null)}
        >
          <div className="mb-5">
            <label className="text-sm font-semibold text-slate-700 block mb-2">Completion Remarks</label>
            <textarea
              value={remarks}
              onChange={e => setRemarks(e.target.value)}
              rows={4}
              placeholder="Describe the work done, materials used, etc."
              className="w-full border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400 resize-none"
            />
          </div>
          <div className="flex gap-3">
            <button onClick={() => setRemarksModal(null)}
              className="flex-1 border border-slate-300 text-slate-700 py-2.5 rounded-xl font-semibold hover:bg-slate-50 transition text-sm">
              Cancel
            </button>
            <button onClick={confirmComplete}
              className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl font-bold transition text-sm">
              ✅ Confirm Complete
            </button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════
   ROOT APP
═══════════════════════════════════════════ */
function App() {
  const [currentUser, setCurrentUser] = useState(null);
  const [requests, setRequests]       = useState(INIT_REQUESTS);

  useEffect(() => {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  }, []);

  function handleSubmit({ category, priority, location, description, submittedBy }) {
    setRequests(prev => [...prev, {
      id: newId(), category, priority, location, description,
      submittedBy,
      submittedAt: new Date().toISOString(),
      status: 'Pending',
      assignedTo: null, assignedAt: null, completionRemarks: null, completedAt: null,
    }]);
  }

  function handleAssign(requestId, incharge) {
    setRequests(prev => prev.map(r =>
      r.id === requestId
        ? { ...r, status: 'Assigned', assignedTo: incharge, assignedAt: new Date().toISOString() }
        : r
    ));
  }

  function handleUpdateStatus(requestId, status, remarks) {
    setRequests(prev => prev.map(r =>
      r.id === requestId
        ? {
            ...r,
            status,
            completionRemarks: remarks ?? r.completionRemarks,
            completedAt: status === 'Completed' ? new Date().toISOString() : r.completedAt,
          }
        : r
    ));
  }

  if (!currentUser) return <><LoginPage onLogin={setCurrentUser} /><InstallPrompt /></>;

  const shared = { user: currentUser, requests, onLogout: () => setCurrentUser(null) };

  if (currentUser.role === 'staff')     return <><StaffDashboard     {...shared} onSubmit={handleSubmit} /><InstallPrompt /></>;
  if (currentUser.role === 'principal') return <><PrincipalDashboard {...shared} onAssign={handleAssign} /><InstallPrompt /></>;
  if (currentUser.role === 'incharge')  return <><InchargeDashboard  {...shared} onUpdateStatus={handleUpdateStatus} /><InstallPrompt /></>;
  return <LoginPage onLogin={setCurrentUser} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
