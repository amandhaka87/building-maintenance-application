<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#1e5799"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>
  <!-- Roof triangle -->
  <polygon points="72,222 256,72 440,222" fill="white"/>
  <!-- Building body -->
  <rect x="100" y="216" width="312" height="254" rx="4" fill="white"/>
  <!-- Windows top row -->
  <rect x="128" y="242" width="72" height="60" rx="5" fill="#1a3a5c"/>
  <rect x="220" y="242" width="72" height="60" rx="5" fill="#1a3a5c"/>
  <rect x="312" y="242" width="72" height="60" rx="5" fill="#1a3a5c"/>
  <!-- Windows bottom sides -->
  <rect x="128" y="318" width="72" height="60" rx="5" fill="#1a3a5c"/>
  <rect x="312" y="318" width="72" height="60" rx="5" fill="#1a3a5c"/>
  <!-- Door -->
  <rect x="211" y="328" width="90" height="142" rx="5" fill="#1a3a5c"/>
  <!-- Wrench badge circle -->
  <circle cx="390" cy="386" r="90" fill="#f59e0b"/>
  <circle cx="390" cy="386" r="76" fill="#fbbf24"/>
  <!-- Wrench body (vertical bar) -->
  <rect x="377" y="326" width="26" height="118" rx="13" fill="white"/>
  <!-- Wrench head top -->
